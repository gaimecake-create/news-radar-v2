name: V3 Daily Signal

permissions:
  contents: write

on:
  schedule:
    # Taiwan time 14:30 = UTC 06:30, after market close.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python main.py

      - name: Generate static latest.json (for Cloudflare Pages, works even when PC off)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # WATCHLIST_CSV 預設就是 watchlist_40.csv（已在 repo 內，免額外 secrets）
        run: uv run python -m stock_strategies.export_static

      - name: Commit static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/latest.json || true
          git diff --cached --quiet || git commit -m "chore: update latest.json $(date -u +%Y-%m-%d)"
          git push || true
